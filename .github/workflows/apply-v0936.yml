name: Apply v0.9.36 exact package

on:
  push:
    branches:
      - agent/update-v0.9.36
    paths:
      - .github/workflows/apply-v0936.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/npg_v0936.tar.xz
          : > "$out"

          # Canonical base64 offsets 0..40000.
          cat .github/update_payload/tar_00 .github/update_payload/tar_01 | tr -d '\r\n' | base64 -d >> "$out"

          # Canonical base64 offsets 40000..60000, stored as exact raw Git blobs.
          for sha in \
            07d6a262475237f55d8cd2f17c7c0b9e2ce42182 \
            7ea8549e768f7f6c328af67c245356714ad22bd6 \
            199f0d7e669f143937ce101ade56a88489c5dee1
          do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d >> "$out"
          done

          # Canonical base64 offsets 60000..100000.
          cat .github/update_payload/tar_03 .github/update_payload/tar_04 | tr -d '\r\n' | base64 -d >> "$out"

          # The remaining tail was staged previously as ordered p16_* base64 blocks.
          mapfile -t tail_files < <(find .github/update_payload -maxdepth 1 -type f -name 'p16_*' -print | sort)
          test ${#tail_files[@]} -gt 0
          cat "${tail_files[@]}" | tr -d '\r\n' | base64 -d >> "$out"

          echo "231008b460eb55acab5529dc2bb9751cdc460880a8531f815964e1c334aeebcd  $out" | sha256sum -c -

          rm -rf /tmp/v0936_release
          mkdir -p /tmp/v0936_release
          tar -xJf "$out" -C /tmp/v0936_release
          src=/tmp/v0936_release/npg_chamber_project_v17
          test -d "$src"
          grep -q '__version__ = "0.9.36"' "$src/npg_chamber/__init__.py"

      - name: Apply clean v0.9.36 source tree
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/v0936_release/npg_chamber_project_v17

          rm -rf developer_tests npg_chamber diagnostic_tools docs original_scripts_backup migration_backups installation_notes
          rm -f README.md SECURITY.md RATE_PID_VALIDATION.md TEST_REPORT.md
          rm -f 01_heat_up_calibration_explanation.pdf \
                02_sputtering_annealing_explanation.pdf \
                03_dp_dbba_evaporation_explanation.pdf \
                04_npg_annealings_explanation.pdf

          cp -a "$src"/. .

          grep -q '__version__ = "0.9.36"' npg_chamber/__init__.py

      - name: Run v0.9.36 test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Remove transfer scaffolding and commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/update_payload .github/v0936_exact .github/v0936_raw
          rm -f .github/workflows/apply-v0936.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.9.36 (2026.08.11-r15)'
          git push origin HEAD:agent/update-v0.9.36
