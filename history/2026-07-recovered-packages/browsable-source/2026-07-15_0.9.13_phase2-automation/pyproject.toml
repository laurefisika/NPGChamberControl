[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npg-chamber"
version = "0.9.13"
description = "Installable launcher package for the ICN2 NPG synthesis chamber workflows."
readme = "READ ME.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.7",
    "colorama>=0.4.6",
    "requests>=2.31",
    "pywebview>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
npg-chamber = "npg_chamber.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["npg_chamber*"]

[tool.setuptools.package-data]
"npg_chamber.legacy_scripts" = ["*.py"]
"npg_chamber.script_explanations" = ["*.pdf"]

[tool.ruff]
line-length = 100
target-version = "py310"
